name: Publish KubePS Powershell Module

on:
  push:
    branches:
      - main
    paths:
      - 'KubePS.psd1'
      - '.gitea/workflows/publish.yaml'
  pull_request:
    branches:
      - main
    paths:
      - 'KubePS.psd1'
      - '.gitea/workflows/publish.yaml'

jobs:
  publish:
    runs-on: ubuntu-latest
    container:
      image: gitea.oghomelab.com/containers/pwsh:latest # Path to your custom image
      credentials:
        username: ${{ secrets.CONTAINER_REGISTRY_USERNAME }}
        password: ${{ secrets.CONTAINER_REGISTRY_PAT }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Publish KubePS Module
        shell: pwsh
        run: |
          Publish-PSResource -Path ./ -Repository 'PSGallery' -NuGetApiKey ${{ secrets.PSGALLERY_API_KEY }}