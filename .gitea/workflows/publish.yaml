name: Publish KubePS Powershell Module

on:
  push:
    branches:
      - main
    paths:
      - 'KubePS.psd1'
      - 'Public/**'
      - '.gitea/workflows/build.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'KubePS.psd1'
      - '.gitea/workflows/build.yml'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up PowerShell
        uses: actions/setup-powershell@v2

      - name: Publish KubePS Module
        run: |
          pwsh -Command "Publish-Module -Path ./KubePS.psd1 -Repository 'PSGallery' -NuGetApiKey ${{ secrets.PSGALLERY_API_KEY }}"